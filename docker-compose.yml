services:
  postgres:
    image: postgres:17
    container_name: construction_erp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: construction_erp
      POSTGRES_USER: erp_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "5432:5432"
    volumes:
      - erp_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp_user -d construction_erp"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrator:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://erp_user:${POSTGRES_PASSWORD}@postgres:5432/construction_erp
      JWT_SECRET: ${JWT_SECRET}
      BOOTSTRAP_ADMIN_TOKEN: ${BOOTSTRAP_ADMIN_TOKEN}
      CORS_ORIGIN: http://localhost:5173
      MIGRATIONS_DIR: /app/database/migrations
    depends_on:
      postgres:
        condition: service_healthy
    command: ["node","dist/db/migrate.js"]
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: construction_erp_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://erp_user:${POSTGRES_PASSWORD}@postgres:5432/construction_erp
      JWT_SECRET: ${JWT_SECRET}
      BOOTSTRAP_ADMIN_TOKEN: ${BOOTSTRAP_ADMIN_TOKEN}
      CORS_ORIGIN: http://localhost:5173
    ports:
      - "4000:4000"
    depends_on:
      migrator:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:4000/api
    container_name: construction_erp_frontend
    restart: unless-stopped
    ports:
      - "5173:4173"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  erp_postgres_data:
